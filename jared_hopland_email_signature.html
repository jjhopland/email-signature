<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jared Hopland Email Signature</title>
</head>
<body style="margin:0; padding:20px; background:#ffffff;">
  <table cellpadding="0" cellspacing="0" border="0" role="presentation"
         style="border-collapse:collapse; font-family:Arial, Helvetica, sans-serif;">
    <tr>
      <td
        background="https://jjhopland.github.io/email-signature/jared_signature_mountains_620x200.png"
        width="620"
        height="200"
        valign="middle"
        style="
          width:620px;
          height:200px;
          background-image:url('https://jjhopland.github.io/email-signature/jared_signature_mountains_620x200.png');
          background-repeat:no-repeat;
          background-position:left top;
          padding:0;
        ">

        <!-- Live/selectable HTML text over the mountain image -->
        <table cellpadding="0" cellspacing="0" border="0" role="presentation"
               style="border-collapse:collapse; margin-left:18px;">
          <tr>
            <td valign="middle"
                style="
                  padding:13px 18px 13px 15px;
                  background-color:rgba(255,255,255,0.84);
                  border-left:3px solid #d39a54;
                ">

              <div style="
                font-family:Georgia, 'Times New Roman', serif;
                font-size:25px;
                line-height:30px;
                font-weight:bold;
                color:#24313a;
                margin:0 0 8px 0;
                white-space:nowrap;
              ">
                Jared Hopland
              </div>

              <table cellpadding="0" cellspacing="0" border="0" role="presentation"
                     style="border-collapse:collapse; font-size:13px; line-height:22px; color:#24313a;">
                <tr>
                  <td width="22" valign="middle" style="font-size:15px; color:#2e6f83; padding:0 6px 0 0;">✉</td>
                  <td valign="middle" style="padding:0;">
                    <a href="mailto:EMAILHERE@EMAIL.COM"
                       style="color:#2e6f83; text-decoration:none; white-space:nowrap;">
                      EMAILHERE@EMAIL.COM
                    </a>
                  </td>
                </tr>
                <tr>
                  <td width="22" valign="middle" style="font-size:15px; color:#2e6f83; padding:0 6px 0 0;">☎</td>
                  <td valign="middle" style="padding:0;">
                    <a href="tel:+1##########"
                       style="color:#2e6f83; text-decoration:none; white-space:nowrap;">
                      (###) ###-####
                    </a>
                  </td>
                </tr>
                <tr>
                  <td width="22" valign="middle" style="font-size:15px; padding:0 6px 0 0;">📍</td>
                  <td valign="middle" style="padding:0; color:#24313a; white-space:nowrap;">
                    CITY NAME, @@(STATE ABRV)
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
